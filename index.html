<style>

.bal.pop{animation:none;transform:scale(0);transition:transform .25s}

@keyframes wig{0%,88%,100%{rotate:0deg}92%{rotate:-4deg}96%{rotate:4deg}}
@keyframes rb{to{background-position:300% 0}}

.tile,.opt{animation:pop .45s cubic-bezier(.2,1.6,.4,1) backwards}.tile:nth-child(3n){animation-delay:.06s}.tile:nth-child(3n+1){animation-delay:.12s}
.big:not(.play){animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards,wig 4s 1s infinite}
h1,.tit{background:linear-gradient(90deg,#ffd54a,#ff5d73,#7b5cff,#2ec4b6,#ffd54a);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 5s linear infinite;text-shadow:none;filter:drop-shadow(0 3px 0 #3a1296)}
.fx{position:fixed;bottom:-40px;z-index:0;pointer-events:none;opacity:.55;animation:rise 8s linear forwards}main{z-index:1}
</style>

<script>

const CONS="BCDFGLMNPRSTV".split(""),VOG="AEIOU".split(""),LET=AL.map(a=>a[0]);
const KIDS=["👧","👦","🧒","👩‍🚀","🧑‍🎤","🦸"],NAMES=["Lia","Tiago","Nina","Rui","Bia","João"];

function kidImg(i,z,nh){const hr=HERO&&!nh,k=hr?{s:HERO.skin,h:HERO.hair,c:HERO.shirt,t:HERO.style,g:HERO.g,a:HERO.a}:KS[i%6],L=hr?lvl(HERO):0,H=[`<path d="M24 46 Q26 14 50 14 Q74 14 76 46 Q60 30 24 46Z" fill="${k.h}"/>`,`<circle cx="22" cy="40" r="11" fill="${k.h}"/><circle cx="78" cy="40" r="11" fill="${k.h}"/><path d="M24 46 Q26 14 50 14 Q74 14 76 46 Q60 30 24 46Z" fill="${k.h}"/>`,`<g fill="${k.h}"><circle cx="30" cy="28" r="12"/><circle cx="50" cy="20" r="13"/><circle cx="70" cy="28" r="12"/><circle cx="24" cy="44" r="9"/><circle cx="76" cy="44" r="9"/></g>`,`<path d="M20 72 Q14 20 50 14 Q86 20 80 72 L70 72 Q74 36 50 30 Q26 36 30 72Z" fill="${k.h}"/>`,`<path d="M24 46 L20 20 L34 30 L40 10 L50 28 L60 10 L66 30 L80 20 L76 46 Q50 30 24 46Z" fill="${k.h}"/>`,`<path d="M24 46 Q26 14 50 14 Q74 14 76 46 Q60 30 24 46Z" fill="${k.h}"/><ellipse cx="82" cy="54" rx="8" ry="15" fill="${k.h}"/>`][k.t];
 return `<svg viewBox="0 0 100 100" width="${z||56}" height="${z||56}" aria-hidden="true">${k.t==3?H:""}${L>=2?'<path d="M10 100 Q8 70 50 68 Q92 70 90 100Z" fill="#e63946"/>':""}<path d="M14 100 Q16 74 50 72 Q84 74 86 100Z" fill="${k.c}"/><rect x="42" y="62" width="16" height="14" fill="${k.s}"/><circle cx="50" cy="46" r="26" fill="${k.s}"/>${k.t==3?`<path d="M26 40 Q50 22 74 40 Q60 32 26 40Z" fill="${k.h}"/>`:H}${GA(k,hr)}${L>=3?'<polygon points="30,22 35,6 43,16 50,3 57,16 65,6 70,22" fill="#ffd54a" stroke="#c98a00" stroke-width="2"/>':""}<circle cx="40" cy="48" r="4" fill="#222"/><circle cx="60" cy="48" r="4" fill="#222"/><circle cx="41.5" cy="46.5" r="1.4" fill="#fff"/><circle cx="61.5" cy="46.5" r="1.4" fill="#fff"/><circle cx="33" cy="57" r="4" fill="#ff8a9a" opacity=".6"/><circle cx="67" cy="57" r="4" fill="#ff8a9a" opacity=".6"/><path d="M40 58 Q50 68 60 58" stroke="#a02040" stroke-width="3" fill="none" stroke-linecap="round"/>${L>=4?'<circle cx="40" cy="48" r="8" fill="none" stroke="#222" stroke-width="2.5"/><circle cx="60" cy="48" r="8" fill="none" stroke="#222" stroke-width="2.5"/><path d="M48 48h4" stroke="#222" stroke-width="2.5"/>':""}${L>=5?'<polygon points="50,82 53,90 62,90 55,95 58,103 50,98 42,103 45,95 38,90 47,90" fill="#ffd54a"/>':""}<ellipse class="om" cx="50" cy="62" rx="8" ry="6" fill="#7a1230"/></svg>`}
const tkRow=(i,t)=>`<div class="tkrow"><div class="tkid">${kidImg(i,92)}</div><div class="bub">${t}</div></div>`;
const kidSay=t=>{const i=R(6);return `<div class="kid"><b>${kidImg(i,64)}</b>${(HERO&&HERO.name)||NAMES[i]} pergunta:</div><div class="w">${t}</div>`};
let HERO=null,PR=[];
try{PR=JSON.parse(localStorage.getItem("ab_profiles")||"[]")}catch(e){PR=[]}
if(!PR.length){try{const o=JSON.parse(localStorage.getItem("ab_hero"));if(o&&o.name){o.stars=+localStorage.getItem("ab_stars")||0;o.g=o.g||"f";PR=[o]}}catch(e){}}
let stars=0,tok=0,VOICE=null,voiceOk=null,h=0,cs=2,streak=0,cl=0,cw=0,CUR=null,nr=0;
PR.forEach((x,i)=>{x.id=x.id||"p"+i});try{const c=localStorage.getItem("ab_cur");HERO=PR.find(x=>x.id===c)||(PR.length==1?PR[0]:null)}catch(e){}stars=HERO?HERO.stars||0:0;
const addStar=()=>{stars++;if(HERO){HERO.stars=stars;saveP()}};
const app=document.getElementById("app");
const paint=()=>{h=(h+47)%360;app.style.setProperty("--h",h)};
/* sons */
let AC;
function beep(f,d,t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+(t||0));o.stop(AC.currentTime+(t||0)+d)}catch(e){}}
const tap=i=>{beep(400+(i%8)*60,.09);paint()};
const yes=()=>{beep(660,.12,0);beep(880,.12,.13);beep(1100,.22,.26)};
const no=()=>beep(220,.28);
function boom(){["⭐","🎉","✨","💖","🎈","🌟"].forEach((e,k)=>{for(let i=0;i<5;i++){const s=document.createElement("span");s.className="cf";s.textContent=e;s.style.left=R(94)+"%";s.style.animationDelay=(R(600)/1000)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2800)}})}
/* voz */
function rank(v){let r=0;if(/pt[-_]PT/i.test(v.lang))r+=10;else r+=2;if(/google|natural|online|neural|enhanced|premium/i.test(v.name))r+=3;if(!v.localService)r+=1;if(/joana|catarina|raquel|fernanda|francisca/i.test(v.name))r+=1;return r}
const ptv=()=>speechSynthesis.getVoices().filter(x=>/^pt/i.test(x.lang));
function loadV(){try{let sv=null;try{sv=localStorage.getItem("ab_voice")}catch(e){}const v=ptv();VOICE=v.find(x=>x.name===sv)||v.slice().sort((a,b)=>rank(b)-rank(a))[0]||null;voiceOk=!!VOICE}catch(e){voiceOk=false}}
function voices(){tok++;const v=ptv();app.innerHTML=bar("Escolher voz")+`<div class="msg" style="font-size:1rem">Toca numa voz para a ouvir. A que escolheres fica guardada.</div>`+(v.length?v.map((x,i)=>`<button class="act" style="display:block;width:100%;text-align:left;margin:6px 0" onclick="setV(${i})">${x.name} (${x.lang})</button>`).join(""):`<div class="msg">Nenhuma voz em português encontrada. Instala em Definições > Texto para voz.</div>`)}
function setV(i){VOICE=ptv()[i];try{localStorage.setItem("ab_voice",VOICE.name)}catch(e){}say("Olá! Esta é a minha voz. Vamos aprender juntos?")}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){voiceOk=false}
function say(t){duck=true;clearTimeout(dk);dk=setTimeout(()=>{duck=false},Math.max(1500,t.length*120));try{speechSynthesis.cancel();speechSynthesis.resume();setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);if(VOICE)u.voice=VOICE;u.lang=VOICE?VOICE.lang:"pt-PT";u.rate=.85;u.pitch=1.05;const k=document.querySelector(".tkid");if(k){k.classList.add("talk");const st=()=>k.classList.remove("talk");u.onend=st;u.onerror=st;setTimeout(st,Math.max(1400,t.length*120))}speechSynthesis.speak(u)},80)}catch(e){}}

const PH={"Wi-Fi":"uái-fái","Yo-yo":"iô-iô","Kiwi":"quívi","Waffle":"uófle","Yoga":"ióga","Xaile":"chaile","Xadrez":"chadrêz","Karaté":"caraté","Zero":"zêro","Helicóptero":"helicóptero"};
const LV=["Aprendiz","Explorador","Campeão","Mestre","Super-herói","Lenda"],lvl=q=>Math.min(6,1+Math.floor((q?q.stars||0:stars)/10));

try{if(localStorage.getItem("ab_music")==="0")MUSIC=false}catch(e){}

 say(NW(n));}
const SC="BCDFGHJKLMNPQRSTVWXYZ".split("");
function sil(){
 app.innerHTML=bar("Sílabas")+`<div class="show stick" id="sh">${tkRow(2,"Toca numa sílaba e repete comigo!")}</div>`+SC.map((c,r)=>`<div class="syl">`+(c=="Q"?["QUA","QUE","QUI","QUO"]:VOG.map(v=>c+v)).map((x,i)=>`<button class="tile" style="--o:${r*37+i*60}" onclick="ssy('${x}',${r+i})">${x}</button>`).join("")+`</div>`).join("");
}
const SV={A:"á",E:"ê",I:"i",O:"ô",U:"u"};
function sylSay(x){
 if(x.startsWith("QU"))return {A:"quá",E:"quê",I:"qui",O:"quô"}[x[2]];
 const c=x[0],v=x[1];
 if(c=="H")return SV[v];
 if(c=="K")return {A:"cá",E:"quê",I:"qui",O:"cô",U:"cu"}[v];
 if(c=="W")return {A:"uá",E:"uê",I:"uí",O:"uô",U:"u"}[v];
 if(c=="Y")return {A:"iá",E:"iê",I:"i",O:"iô",U:"iu"}[v];
 return c.toLowerCase()+SV[v]}
function ssy(x,i){tap(i);document.getElementById("sh").innerHTML=tkRow(i%6,`<span style="font-size:2.2rem">${x}</span>`);say(sylSay(x))}
/* jogos */
function pool(ok,all,k){const o=[ok];let g=0;while(o.length<k&&g++<80){const x=all[R(all.length)];if(!o.includes(x))o.push(x)}return o.sort(()=>Math.random()-.5)}
const NS=Array.from({length:10},(_,i)=>i+1);
function gmenu(){app.innerHTML=bar("Jogos")+`<div class="menu">
 <button class="big" style="--o:0" onclick="play(1)"><span>🐝</span>Letra inicial</button>
 <button class="big" style="--o:60" onclick="play(2)"><span>👂</span>Ouve e encontra</button>
 <button class="big" style="--o:120" onclick="play(3)"><span>🍎</span>Quantos são?</button>
 <button class="big" style="--o:180" onclick="play(4)"><span>➡️</span>Qual vem depois?</button>
 <button class="big" style="--o:240" onclick="play(5)"><span>🎈</span>Rebenta o balão</button>
 <button class="big" style="--o:300" onclick="play(6)"><span>🔠</span>Grande e pequena</button></div>`}
function play(g){let show,ok,opts,sp;
 if(g==1){const a=AL[R(26)],w=a[1+R(2)];ok=a[0];opts=pool(ok,LET,3);show=`<div class="e">${w[1]}</div>`+kidSay(`${w[0]} começa com qual letra?`);sp=`${PH[w[0]]||w[0]} começa com qual letra?`}
 if(g==2){ok=LET[R(26)];opts=pool(ok,LET,3);show=`<div class="mas">👂</div>`+kidSay("Ouve e toca na letra")+`<button class="act" onclick="say(CUR.sp)">🔊 Ouvir outra vez</button>`;sp=`Toca na letra ${LN[LET.indexOf(ok)]}`}
 if(g==3){const mx=Math.min(20,6+lvl()*3),AN=Array.from({length:mx},(_,i)=>i+1);ok=AN[R(mx)];opts=pool(ok,AN,3);show=`<div class="e" style="font-size:${ok>10?"1.9rem":"2.8rem"}">${NEM[R(20)].repeat(ok)}</div>`+kidSay("Quantos são?");sp="Quantos são?"}
 if(g==4){const n=R(99);ok=n+1;opts=pool(ok,[ok-2,ok-1,ok+1,ok+2,ok+3].filter(x=>x>=0&&x<=100&&x!=ok),3);show=`<div class="l">${n}</div>`+kidSay(`Qual número vem depois do ${NW(n)}?`);sp=`Qual número vem depois do ${NW(n)}?`}
 if(g==6){const l=LET[R(26)],up=R(2);ok=up?l.toLowerCase():l;const from=up?l:l.toLowerCase();opts=pool(ok,LET.map(x=>up?x.toLowerCase():x),3);show=`<div class="l">${from}</div>`+kidSay(up?"Qual é a letra pequena?":"Qual é a letra grande?");sp=`Qual é a letra ${up?"pequena":"grande"} de ${LN[LET.indexOf(l)]}?`}
 if(g==5){ok=LET[R(26)];opts=pool(ok,LET,6);sp=`Rebenta o balão da letra ${LN[LET.indexOf(ok)]}`;show=null}
 CUR={g,ok:String(ok),sp};
 if(g==5){app.innerHTML=bar("Balões")+`<div class="msg">${kidImg(R(6),42)} Rebenta o balão da letra <span style="font-size:2rem">${ok}</span></div><div class="sea">`+opts.map((o,i)=>`<button class="bal" style="--o:${i*57};left:${(i%3)*31+4}%;top:${(i<3?8:52)}%;animation-delay:${i*.4}s" onclick="ans('${o}',this)">${o}</button>`).join("")+`</div><div class="msg" id="m"></div><div style="text-align:center"><button class="act" onclick="say(CUR.sp)">🔊 Ouvir outra vez</button></div>`}
 else app.innerHTML=bar("Jogo")+`<div class="show">${show}</div><div class="opts">`+opts.map((o,i)=>`<button class="opt" style="--o:${i*80+g*30}" onclick="ans('${o}',this)">${o}</button>`).join("")+`</div><div class="msg" id="m">${streak>1?"🔥 Combo "+streak:""}</div>`;
 setTimeout(()=>say(sp),300);
}
function ans(o,b){const m=document.getElementById("m"),g=CUR.g;
 if(o==CUR.ok){addStar();streak++;b.classList.add("pop");document.getElementById("st").textContent=stars;boom();yes();
  let t=`🎉 Muito bem! +1 ⭐${streak>1?" 🔥 Combo "+streak:""}`,v="Muito bem"+(HERO&&HERO.name?", "+HERO.name:"")+"! Parabéns!";
  if(stars%10==0){t=`🏆 Subiste para o nível ${lvl()}: ${LV[lvl()-1]}! ${ACCN[lvl()]||""}`;v=`Uau! Subiste de nível! Agora és ${LV[lvl()-1]}!`;boom();boom()}else if(stars%5==0){const x=STK[stars/5-1]||"🎁";t=`🎁 Ganhaste o autocolante ${x}!`;v="Uau! Ganhaste um autocolante novo!"}
  m.textContent=t;setTimeout(()=>say(v),500);const my=tok;setTimeout(()=>{if(my===tok)play(g)},2600)}
 else{streak=0;b.style.opacity=.25;m.textContent="Tenta outra vez 💪";no();setTimeout(()=>say("Tenta outra vez"+(HERO&&HERO.name?", "+HERO.name:"")),300)}
}
splash();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
