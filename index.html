const CP=w=>w.replace(/[.,!?]/g,""),LRT=(ws,c)=>ws.slice(c[0],c[1]+1).map(w=>{const x=CP(w);return PH[x]||x}).join(" ").toLowerCase();
function lrChunks(ws){const o=[];for(let i=0;i<ws.length;i++){if(CP(ws[i]).length<=1&&i<ws.length-1){o.push([i,i+1]);i++}else o.push([i,i])}return o}
let LR=null;
function lrNew(){const lv=lvl(),pl=SEN.filter(x=>x[0].split(" ").length<=2+lv&&(!LR||x[0]!==LR.s)),s=pl[R(pl.length)],first=!LR;
 LR={s:s[0],e:s[1],ws:s[0].split(" "),k:LR?LR.k+1:0,got:[],used:{},lock:0};LR.cs=lrChunks(LR.ws);
 lrDraw("read",first?`Olá${HERO&&HERO.name?", "+HERO.name:""}! Eu sou o Liyan. Vamos ler juntos!`:"Ouve e lê comigo!");const my=tok;setTimeout(()=>lrReadAll(my),600)}
function lrDraw(mode,msg,extra){const gp=mode==="gap"?LR.gap:-1;
 app.innerHTML=bar("Ler com o Liyan")+`<div class="show" style="min-height:0">${tkRow(0,msg)}<div class="e" style="font-size:3rem">${LR.e}</div><div class="sent">`+LR.ws.map((w,i)=>mode==="order"?`<span class="wd ${i<LR.got.length?"":"ph"}">${i<LR.got.length?esc(w):"__"}</span>`:i===gp?`<span class="wd ph">____</span>`:`<button class="wd" id="wd${i}" onclick="lrW(${i})">${esc(w)}</button>`).join("")+`</div></div><div id="lrx">${extra||""}</div><div class="msg" id="lm"></div>`}
function lrW(i){const c=LR.cs.find(c=>i>=c[0]&&i<=c[1]);say(LRT(LR.ws,c),.8)}
function lrReadAll(my){let j=0;const hl=(c,on)=>{for(let i=c[0];i<=c[1];i++){const e=document.getElementById("wd"+i);if(e)e.classList.toggle("on",on)}};
 (function nx(){if(my!==tok)return;if(j>=LR.cs.length){say(LRT(LR.ws,[0,LR.ws.length-1])+".",.9,()=>{if(my===tok)lrAsk()});return}
  const c=LR.cs[j++];hl(c,true);say(LRT(LR.ws,c),.8,()=>{if(my!==tok)return;hl(c,false);setTimeout(nx,150)})})()}

function lrO(i){if(LR.lock||LR.used[i])return;const w=CP(LR.ws[LR.sh[i]]);if(w===CP(LR.ws[LR.got.length])){LR.got.push(LR.ws[LR.got.length]);LR.used[i]=1;tap(i);lrOrderDraw();if(LR.got.length===LR.ws.length)lrWin()}else{no();document.getElementById("lm").textContent="Tenta outra vez 💪"}}
function lrWin(){LR.lock=1;LR.fill=1;addStar();const e=document.getElementById("st");if(e)e.textContent=stars;boom();yes();document.getElementById("lm").textContent="🎉 Muito bem! +1 ⭐";const my=tok;
 setTimeout(()=>say("Muito bem"+(HERO&&HERO.name?", "+HERO.name:"")+"! "+LRT(LR.ws,[0,LR.ws.length-1]),.9,()=>setTimeout(()=>{if(my===tok)lrNew()},1200)),500)}
/* telas */
const bar=t=>{tok++;try{speechSynthesis.cancel()}catch(e){}return `<div class="top"><button class="back" onclick="home()">⬅</button><h2>${t}</h2><div class="stars">⭐ <span id="st">${stars}</span></div></div>`};
function splash(){tok++;
 app.innerHTML=`<svg class="logo" viewBox="0 0 200 200" width="190" height="190" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e6bff"/><stop offset="1" stop-color="#ff5d73"/></linearGradient></defs><rect x="8" y="8" width="184" height="184" rx="44" fill="url(#gg)" stroke="#fff" stroke-opacity=".6" stroke-width="4"/><polygon points="100,24 111.2,54.6 143.7,55.8 118.1,75.9 127,107.2 100,89 73,107.2 81.9,75.9 56.3,55.8 88.8,54.6" fill="#ffb627" stroke="#fff7e0" stroke-width="3"/><text x="100" y="150" text-anchor="middle" font-size="34" font-weight="800" fill="#fff" font-family="Trebuchet MS,sans-serif">ABC 123</text><text x="30" y="40" font-size="22">✨</text><text x="150" y="44" font-size="22">🎈</text></svg>
 <h1 class="tit">Aprendo a Brincar</h1><div class="sub">O jogo de letras, números e sílabas</div>
 <img class="scene" src="${SCENE}" alt="Os amigos do Vale das Estrelas">
 <div class="fl"><span>🔤</span><span>🔢</span><span>🧩</span><span>🎈</span><span>🏆</span></div>
 <button class="big play" style="--o:0" onclick="go()"><span style="font-size:2.2rem">▶</span>JOGAR</button>`;
}
function home(){onClose();tok++;try{speechSynthesis.cancel()}catch(e){}
 app.innerHTML=`<div class="kidrow">${CH.map((c,i)=>`<img class="av ${i<chN()?"":"lock"}" src="${c.src}" alt="${c.n}">`).join("")}</div><h1>🌈 Aprendo a Brincar ✨</h1>${HERO&&HERO.name?`<div class="kidrow">${kidImg(0,100)}</div><div class="msg">Olá, ${HERO.name}! 👋</div>`:""}<div class="mas" style="font-size:2rem">🦄 🚀 🐘 🌟 🎈</div><div class="menu">
 <button class="big" style="--o:0" onclick="alfa()"><span>🔤</span>Letras</button>
 <button class="big" style="--o:90" onclick="nums()"><span>🔢</span>Números</button>
 <button class="big" style="--o:180" onclick="sil()"><span>🧩</span>Sílabas</button>
 <button class="big" style="--o:270" onclick="gmenu()"><span>🎮</span>Jogos</button><button class="big" style="--o:330;grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px" onclick="LR=null;lrNew()"><span style="font-size:2rem">📖</span>Ler com o Liyan</button></div>
 <div class="show" style="min-height:0;padding:10px"><div class="w">Nível ${lvl()} · ${LV[lvl()-1]}</div><div class="bar"><i style="width:${stars%10*10}%"></i></div><div class="w" style="font-size:1rem">⭐ ${stars} estrelas</div></div><button class="big" style="--o:330;width:100%;flex-direction:row;justify-content:center;gap:10px;margin-bottom:6px" onclick="premios()"><span style="font-size:2rem">🏆</span>Prémios</button><button class="big" style="--o:200;width:100%;flex-direction:row;justify-content:center;gap:10px;margin-bottom:6px" onclick="creator()"><span style="font-size:2rem">🦸</span>O meu herói</button><button class="big" style="--o:260;width:100%;flex-direction:row;justify-content:center;gap:10px;margin-bottom:6px" onclick="mpSetup()"><span style="font-size:2rem">👥</span>Multijogador</button><button class="big" style="--o:280;width:100%;flex-direction:row;justify-content:center;gap:10px;margin-bottom:6px" onclick="onlineMenu()"><span style="font-size:2rem">🌐</span>Jogar online</button><button class="big" style="--o:300;width:100%;flex-direction:row;justify-content:center;gap:10px;margin-bottom:6px" onclick="whoPlays()"><span style="font-size:2rem">🔄</span>Trocar de jogador</button>
 <div style="text-align:center"><button class="act" onclick="testVoice()">🔊 Testar a voz</button><button class="act" onclick="voices()">🎙️ Escolher voz</button></div><div class="msg" id="vm" style="font-size:1rem"></div>
 <details class="card"><summary>👨‍👩‍👧 Para os pais</summary><button class="act" onclick="recScreen()">🎙️ Gravar a minha voz</button><p>Grava letras, sílabas e palavras com a tua voz (ou de uma professora). O jogo usa as gravações no lugar da voz do telemóvel. Ficam só neste aparelho.</p><p>Sentem-se juntos 10 a 15 minutos por dia e peçam à criança que repita o som em voz alta.</p><p>Sem anúncios, sem registo, sem recolha de dados. As estrelas ficam só neste telemóvel.</p><p>Sem voz? Abre no Chrome, aumenta o volume e instala o português (Portugal) em Definições > Texto para voz.</p></details>`;
}
const cs_=l=>cs==0?l:cs==1?l.toLowerCase():l+" "+l.toLowerCase();
function alfa(){
 app.innerHTML=bar("Letras")+`<div class="chips"><button class="chip ${cs==0?"on":""}" onclick="cs=0;alfa()">ABC</button><button class="chip ${cs==1?"on":""}" onclick="cs=1;alfa()">abc</button><button class="chip ${cs==2?"on":""}" onclick="cs=2;alfa()">Aa</button></div>
 <div class="show" id="sh">${tkRow(0,"Olá! Toca numa letra e eu falo para ti!")}</div>
 <button class="act" onclick="say(LN[cl])">🔊 Letra</button><button class="act" onclick="hear()">🗣️ Palavra</button><button class="act" onclick="pick(cl,1)">🔄 Outra</button><button class="act" onclick="abc()">🎵 ABC</button><div class="grid">`+
 AL.map((a,i)=>`<button class="tile" id="t${i}" style="--o:${i*29};${cs==2?"font-size:1.3rem":""}" onclick="pick(${i})">${cs_(a[0])}</button>`).join("")+`</div>`;
}
function pick(i,k){const a=AL[i];cw=k?1-cw:0;cl=i;const w=a[1+cw],ki=R(6);tap(i);
 document.getElementById("sh").innerHTML=`${tkRow(ki,LN[i]+"!")}<div class="l">${a[0]} ${a[0].toLowerCase()}</div><div class="e">${w[1]}</div><div class="w">${a[0]} de ${w[0]}</div>`;
 sayK("L:"+a[0],LN[i])}
function hear(){const w=AL[cl][1+cw][0];sayK("W:"+w,`${LN[cl]} de ${PH[w]||w}`)}
function abc(){const my=++tok;let k=0;(function n(){if(my!==tok||k>=26)return;document.querySelectorAll(".tile").forEach(x=>x.classList.remove("hl"));const t=document.getElementById("t"+k);if(t)t.classList.add("hl");paint();document.getElementById("sh").innerHTML=tkRow(k%6,LN[k]+"!")+`<div class="l">${AL[k][0]} ${AL[k][0].toLowerCase()}</div>`;sayK("L:"+AL[k][0],LN[k]);k++;setTimeout(n,1300)})()}
function nums(r){if(r!==undefined)nr=r;const s=nr*20+(nr?1:0),e=Math.min(100,nr*20+20);
 const rg=[["0-20",0],["21-40",1],["41-60",2],["61-80",3],["81-100",4]];
 app.innerHTML=bar("Números")+`<div class="chips">`+rg.map(x=>`<button class="chip ${x[1]==nr?"on":""}" onclick="nums(${x[1]})">${x[0]}</button>`).join("")+`</div><div class="show" id="sh">${tkRow(1,"Olá! Toca num número e eu falo para ti!")}</div><div class="grid">`+
 Array.from({length:e-s+1},(_,i)=>s+i).map(n=>`<button class="tile" style="--o:${n*23};font-size:${n>9?"1.4rem":"1.7rem"}" onclick="pn(${n})">${n}</button>`).join("")+`</div>`;
}
function pn(n){tap(n);const ki=R(6);let v;
 if(n<=20)v=`<div class="e" style="font-size:${n>10?"2.2rem":"3.4rem"}">${n?NEM[n-1].repeat(n):"🕳️"}</div>`;
 else v=`<div class="e" style="font-size:1.5rem">${"🟦".repeat(n/10|0)}<br>${"🟨".repeat(n%10)}</div><div class="w" style="font-size:1rem">${n/10|0} dezenas${n%10?" e "+n%10+" unidades":""}</div>`;
 document.getElementById("sh").innerHTML=`${tkRow(ki,NW(n)+"!")}<div class="l">${n}</div>${v}`;
 sayK("N:"+n,NW(n))}
const SC="BCDFGHJKLMNPQRSTVWXYZ".split("");
function sil(){
 app.innerHTML=bar("Sílabas")+`<div class="show stick" id="sh">${tkRow(2,"Toca numa sílaba e repete comigo!")}</div>`+SC.map((c,r)=>`<div class="syl">`+(c=="Q"?["QUA","QUE","QUI","QUO"]:VOG.map(v=>c+v)).map((x,i)=>`<button class="tile" style="--o:${r*37+i*60}" onclick="ssy('${x}',${r+i})">${LBL[x]||x}</button>`).join("")+`</div>`).join("");
}
const LBL={XE:"XÊ"};const SV={A:"á",E:"ê",I:"i",O:"ô",U:"u"};
function sylSay(x){if(/[ÁÉÓÊÔ]/.test(x))return x.toLowerCase();if(x.length==1)return SV[x];if(x[0]==="X"&&x.length==2)return"ch"+SV[x[1]];
 if(x.startsWith("QU"))return {A:"quá",E:"quê",I:"qui",O:"quô"}[x[2]];
 const c=x[0],v=x[1];
 if(c=="H")return SV[v];
 if(c=="K")return {A:"cá",E:"quê",I:"qui",O:"cô",U:"cu"}[v];
 if(c=="W")return {A:"uá",E:"uê",I:"uí",O:"uô",U:"u"}[v];
 if(c=="Y")return {A:"iá",E:"iê",I:"i",O:"iô",U:"iu"}[v];
 return c.toLowerCase()+SV[v]}
function ssy(x,i){tap(i);document.getElementById("sh").innerHTML=tkRow(i%6,`<span style="font-size:2.2rem">${LBL[x]||x}</span>`);const w=sylSay(x);sayK("S:"+x,w,.85)}
/* jogos */
function pool(ok,all,k){const o=[ok];let g=0;while(o.length<k&&g++<80){const x=all[R(all.length)];if(!o.includes(x))o.push(x)}return o.sort(()=>Math.random()-.5)}
const NS=Array.from({length:10},(_,i)=>i+1);
function gmenu(){app.innerHTML=bar("Jogos")+`<div class="menu">
 <button class="big" style="--o:0" onclick="play(1)"><span>🐝</span>Letra inicial</button>
 <button class="big" style="--o:60" onclick="play(2)"><span>👂</span>Ouve e encontra</button>
 <button class="big" style="--o:120" onclick="play(3)"><span>🍎</span>Quantos são?</button>
 <button class="big" style="--o:180" onclick="play(4)"><span>➡️</span>Qual vem depois?</button>
 <button class="big" style="--o:240" onclick="play(5)"><span>🎈</span>Rebenta o balão</button>
 <button class="big" style="--o:300" onclick="play(6)"><span>🔠</span>Grande e pequena</button><button class="big" style="--o:30" onclick="play(7)"><span>🧱</span>Forma a palavra</button><button class="big" style="--o:90" onclick="play(8)"><span>📖</span>Lê e escolhe</button></div>`}
function play(g){if(g==7){wbNew();return}let show,ok,opts,sp;
 if(g==1){const a=AL[R(26)],w=a[1+R(2)];ok=a[0];opts=pool(ok,LET,3);show=`<div class="e">${w[1]}</div>`+kidSay(`${w[0]} começa com qual letra?`);sp=`${PH[w[0]]||w[0]} começa com qual letra?`}
 if(g==2){ok=LET[R(26)];opts=pool(ok,LET,3);show=`<div class="mas">👂</div>`+kidSay("Ouve e toca na letra")+`<button class="act" onclick="say(CUR.sp)">🔊 Ouvir outra vez</button>`;sp=`Toca na letra ${LN[LET.indexOf(ok)]}`}
 if(g==3){const mx=Math.min(20,6+lvl()*3),AN=Array.from({length:mx},(_,i)=>i+1);ok=AN[R(mx)];opts=pool(ok,AN,3);show=`<div class="e" style="font-size:${ok>10?"1.9rem":"2.8rem"}">${NEM[R(20)].repeat(ok)}</div>`+kidSay("Quantos são?");sp="Quantos são?"}
 if(g==4){const n=R(99);ok=n+1;opts=pool(ok,[ok-2,ok-1,ok+1,ok+2,ok+3].filter(x=>x>=0&&x<=100&&x!=ok),3);show=`<div class="l">${n}</div>`+kidSay(`Qual número vem depois do ${NW(n)}?`);sp=`Qual número vem depois do ${NW(n)}?`}
 if(g==6){const l=LET[R(26)],up=R(2);ok=up?l.toLowerCase():l;const from=up?l:l.toLowerCase();opts=pool(ok,LET.map(x=>up?x.toLowerCase():x),3);show=`<div class="l">${from}</div>`+kidSay(up?"Qual é a letra pequena?":"Qual é a letra grande?");sp=`Qual é a letra ${up?"pequena":"grande"} de ${LN[LET.indexOf(l)]}?`}
 if(g==5){ok=LET[R(26)];opts=pool(ok,LET,6);sp=`Rebenta o balão da letra ${LN[LET.indexOf(ok)]}`;show=null}
 if(g==8){const w=WD[R(WD.length)];ok=w[1];opts=pool(ok,WD.map(x=>x[1]),3);show=`<div class="l" style="font-size:3rem">${w[0].replace(/-/g,"")}</div>`+kidSay("Que desenho é este?");sp="Lê a palavra e escolhe o desenho"}
 CUR={g,ok:String(ok),sp};
 if(g==5){app.innerHTML=bar("Balões")+`<div class="msg">${kidImg(R(6),42)} Rebenta o balão da letra <span style="font-size:2rem">${ok}</span></div><div class="sea">`+opts.map((o,i)=>`<button class="bal" style="--o:${i*57};left:${(i%3)*31+4}%;top:${(i<3?8:52)}%;animation-delay:${i*.4}s" onclick="ans('${o}',this)">${o}</button>`).join("")+`</div><div class="msg" id="m"></div><div style="text-align:center"><button class="act" onclick="say(CUR.sp)">🔊 Ouvir outra vez</button></div>`}
 else app.innerHTML=bar("Jogo")+`<div class="show">${show}</div><div class="opts">`+opts.map((o,i)=>`<button class="opt" style="--o:${i*80+g*30}" onclick="ans('${o}',this)">${o}</button>`).join("")+`</div><div class="msg" id="m">${streak>1?"🔥 Combo "+streak:""}</div>`;
 setTimeout(()=>say(sp),300);
}
function ans(o,b){const m=document.getElementById("m"),g=CUR.g;
 if(o==CUR.ok){addStar();streak++;b.classList.add("pop");document.getElementById("st").textContent=stars;boom();yes();
  let t=`🎉 Muito bem! +1 ⭐${streak>1?" 🔥 Combo "+streak:""}`,v="Muito bem"+(HERO&&HERO.name?", "+HERO.name:"")+"! Parabéns!";
  if(stars%10==0){t=`🏆 Subiste para o nível ${lvl()}: ${LV[lvl()-1]}! ${ACCN[lvl()]||""} Novo amigo: ${CH[lvl()-1]?CH[lvl()-1].n:""}!`;v=`Uau! Subiste de nível! Agora és ${LV[lvl()-1]}! Tens um novo amigo!`;boom();boom();fan();const fi=lvl()-1;setTimeout(()=>friendPop(fi),900)}else if(stars%5==0){const x=STK[stars/5-1]||"🎁";t=`🎁 Ganhaste o autocolante ${x}!`;v="Uau! Ganhaste um autocolante novo!"}
  m.textContent=t;setTimeout(()=>say(v),500);const my=tok;setTimeout(()=>{if(my===tok)play(g)},2600)}
 else{streak=0;b.style.opacity=.25;m.textContent="Tenta outra vez 💪";no();setTimeout(()=>say("Tenta outra vez"+(HERO&&HERO.name?", "+HERO.name:"")),300)}
}
splash();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
